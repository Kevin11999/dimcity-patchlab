# PatchLab RDM (mobile/): analyze + test on every change, then build the Android APKs and the
# Windows installer, the macOS disk image and an unsigned iOS app. The builds are attached to the run (Actions -> run -> Artifacts). Pushes to
# main and manual runs (Actions -> Mobile -> Run workflow) also publish them together as one GitHub
# *pre-release* "mobile-v<version>-b<run>". A pre-release never counts as "latest", so the desktop
# app's update check (which reads /releases/latest) is not affected.
name: Mobile

on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64,android-arm --split-per-abi
      - id: v
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "PatchLab-RDM-$V-b${{ github.run_number }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "PatchLab-RDM-$V-b${{ github.run_number }}-armeabi-v7a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PatchLab-RDM-android
          path: mobile/PatchLab-RDM-*.apk

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Add the Visual C++ runtime next to the exe
        # A clean Windows machine may not have the VC++ runtime; shipping these three DLLs with the app
        # (app-local deployment) makes the installer work without a separate download.
        run: |
          $rel = "build\windows\x64\runner\Release"
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (-not (Test-Path $src)) { throw "$src not found on the runner" }
            Copy-Item $src $rel
          }
          Get-ChildItem $rel | Select-Object Name, Length
      - name: Smoke test, the exe must stay running
        # Informational: a GUI app on a headless runner can behave differently from a real desktop.
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "build\windows\x64\runner\Release\patchlab_rdm.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "patchlab_rdm.exe exited after start, exit code $($p.ExitCode)" }
          Write-Host "patchlab_rdm.exe is running (pid $($p.Id)), main window: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
      - id: v
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build the installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" "/DBuildNumber=${{ github.run_number }}" windows\installer\patchlab_rdm.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem build\installer
      - name: Portable zip
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\installer\PatchLab-RDM-${{ steps.v.outputs.version }}-b${{ github.run_number }}-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PatchLab-RDM-windows
          path: |
            mobile/build/installer/*.exe
            mobile/build/installer/*.zip

  macos:
    name: macOS app
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Sign ad hoc and check
        # No Apple developer certificate: an ad-hoc signature is what lets the app start on Apple Silicon.
        # (Gatekeeper still asks for one extra confirmation on first start, see the release notes.)
        run: |
          APP="build/macos/Build/Products/Release/PatchLab RDM.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "architectures: $(lipo -archs "$APP/Contents/MacOS/PatchLab RDM")"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundle(Short)?Version|CFBundleIdentifier|NSLocalNetwork|LSMinimum"
      - name: Smoke test, the app must stay running
        # Informational: a GUI app on a headless runner can behave differently from a real desktop.
        continue-on-error: true
        run: |
          APP="build/macos/Build/Products/Release/PatchLab RDM.app"
          "$APP/Contents/MacOS/PatchLab RDM" &
          PID=$!
          sleep 10
          if ! kill -0 $PID 2>/dev/null; then echo "the app exited after start"; exit 1; fi
          echo "PatchLab RDM is running (pid $PID)"
          kill $PID
      - name: Disk image and zip
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          N=${{ github.run_number }}
          APP="build/macos/Build/Products/Release/PatchLab RDM.app"
          mkdir -p build/dist stage
          cp -R "$APP" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "PatchLab RDM" -srcfolder stage -ov -format UDZO "build/dist/PatchLab-RDM-$V-b$N-macos.dmg"
          ditto -c -k --keepParent "$APP" "build/dist/PatchLab-RDM-$V-b$N-macos.zip"
          ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: PatchLab-RDM-macos
          path: |
            mobile/build/dist/*.dmg
            mobile/build/dist/*.zip

  ios:
    name: iOS app (unsigned)
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Pack an unsigned .ipa
        # Apple only runs signed apps. This one is signed on the phone's side by the tool that installs it
        # (Sideloadly, AltStore with the owner's Apple ID) or by Xcode with the owner's team.
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          N=${{ github.run_number }}
          APP="build/ios/iphoneos/Runner.app"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Short)?Version|CFBundleIdentifier|CFBundleDisplayName|NSLocalNetwork"
          mkdir -p build/dist-ios/Payload
          cp -R "$APP" build/dist-ios/Payload/
          (cd build/dist-ios && zip -qry "PatchLab-RDM-$V-b$N-ios-unsigned.ipa" Payload && rm -rf Payload)
          ls -la build/dist-ios
      - uses: actions/upload-artifact@v4
        with:
          name: PatchLab-RDM-ios
          path: mobile/build/dist-ios/*.ipa

  publish:
    name: Publish pre-release
    needs: [android, windows, macos, ios]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: PatchLab-RDM-*
          path: downloads
          merge-multiple: true
      - run: ls -la downloads
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.v.outputs.version }}-b${{ github.run_number }}
          name: PatchLab RDM ${{ steps.v.outputs.version }} (test build ${{ github.run_number }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: downloads/*
          body: |
            Test build of the PatchLab RDM app (addresses DMX fixtures through RDM over Art-Net / RDMnet).

            **Windows**: download `PatchLab-RDM-Setup-*.exe` and run it. The installer is not code-signed, so SmartScreen shows
            "Windows protected your PC": click *More info*, then *Run anyway*. It adds a Start menu shortcut and a firewall rule
            for Art-Net (UDP). A portable `.zip` is attached as well.

            **macOS** (12 or newer, Apple Silicon and Intel): open `PatchLab-RDM-*-macos.dmg` and drag the app to Applications. The app is
            not notarized, so macOS blocks the first start: open *System Settings, Privacy & Security* and press *Open Anyway*
            (or run `xattr -dr com.apple.quarantine "/Applications/PatchLab RDM.app"` in Terminal). Allow *Local Network* when macOS asks.
            If it did not ask or you said no: System Settings, Privacy & Security, Local Network. A `.zip` is attached as well.

            **iPhone / iPad** (iOS 15 or newer): `PatchLab-RDM-*-ios-unsigned.ipa` is **not signed**; Apple only runs signed apps. Install it with
            Sideloadly or AltStore and your own Apple ID (the app then runs for 7 days), or build it in Xcode with your own team.
            iOS only lets an app send and receive broadcast / multicast with Apple's *Multicast Networking* entitlement, which Apple
            grants on request to paid developer accounts: without it finding lamps by broadcast may not work on an iPhone.

            **Android** (7.0 or newer): download the `.apk` for the phone (`arm64-v8a` for almost every phone, `armeabi-v7a` for 32-bit),
            open it and allow "install unknown apps" for the browser when asked.

            Builds are signed with a fixed test key, so a newer Android build installs over an older one.
