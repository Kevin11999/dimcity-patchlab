<!doctype html>
<html lang="nl" data-thema="donker">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabeltool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="balk"></header>
  <aside id="kolom">
    <div id="kolom-inhoud"></div>
  </aside>
  <main id="hoofd">
    <nav id="tabs">
      <button data-tab="drie" onclick="KT.ui.tabblad('drie')">3D</button>
      <button data-tab="project" onclick="KT.ui.tabblad('project')">Kabels</button>
      <button data-tab="waarsch" onclick="KT.ui.tabblad('waarsch')">Waarschuwingen</button>
      <button data-tab="bib" onclick="KT.ui.tabblad('bib')">Bibliotheek</button>
      <button data-tab="inst" onclick="KT.ui.tabblad('inst')">Instellingen</button>
      <label class="slot" title="Nummers vastzetten (kabels zijn al gestempeld)"><input type="checkbox" id="slot" onchange="KT.ui.zetSlot(this.checked)"> Op slot</label>
    </nav>
    <div id="inhoud"></div>
    <div id="drie">
      <div id="gl"></div>
      <canvas id="canvas"></canvas>
      <div id="tip"></div>
    </div>
  </main>
  <footer id="status" class="status"></footer>
</div>
<script src="vendor/three-kabeltool.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/symbol.js"></script>
<script src="js/network.js"></script>
<script src="js/viewer3d.js"></script>
<script src="js/viewer3d-gl.js"></script>
<script src="js/app.js"></script>
<script src="js/vw.js"></script>
</body>
</html>
