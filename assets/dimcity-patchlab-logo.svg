<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Achtergrond -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050910"/>
      <stop offset="100%" stop-color="#101826"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="80"
        fill="url(#bgGrad)"/>

  <!-- DB-tegel -->
  <rect x="136" y="112" width="240" height="130" rx="16"
        fill="#182435" stroke="#28354a" stroke-width="4"/>

  <!-- DB-label -->
  <text x="256" y="162"
        text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="36"
        fill="#eaf2ff"
        font-weight="600">
    DB
  </text>

  <!-- Universe-lijn boven de 'lijnen' -->
  <line x1="140" y1="280" x2="372" y2="280"
        stroke="#4ea8ff" stroke-width="6"
        stroke-linecap="round"/>

  <!-- Drie 'Veam / LK' lijnen -->
  <!-- Links -->
  <line x1="190" y1="280" x2="190" y2="365"
        stroke="#ff8a00" stroke-width="10"
        stroke-linecap="round"/>
  <circle cx="190" cy="365" r="10" fill="#ff8a00"/>

  <!-- Midden -->
  <line x1="256" y1="280" x2="256" y2="395"
        stroke="#ff8a00" stroke-width="10"
        stroke-linecap="round"/>
  <circle cx="256" cy="395" r="10" fill="#ff8a00"/>

  <!-- Rechts -->
  <line x1="322" y1="280" x2="322" y2="365"
        stroke="#ff8a00" stroke-width="10"
        stroke-linecap="round"/>
  <circle cx="322" cy="365" r="10" fill="#ff8a00"/>

  <!-- Kleine subtitel onderaan (optioneel) -->
  <text x="256" y="448"
        text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="24"
        fill="#7b8794">
    DimCity PatchLab
  </text>
</svg>
