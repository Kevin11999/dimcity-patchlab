<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabeltool Vectorworks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="kolom">
    <div class="kop">
      <div class="logo"><span class="logo-blok"></span>Kabeltool</div>
      <div id="bestand" class="stil"></div>
    </div>
    <div id="tools"></div>
    <div id="selectie"></div>
    <div id="status" class="status"></div>
  </aside>
  <main id="hoofd">
    <nav id="tabs">
      <button data-tab="drie" onclick="KT.ui.tabblad('drie')">3D</button>
      <button data-tab="project" onclick="KT.ui.tabblad('project')">Kabels</button>
      <button data-tab="bib" onclick="KT.ui.tabblad('bib')">Kabelbibliotheek</button>
      <button data-tab="blokken" onclick="KT.ui.tabblad('blokken')">Blokken</button>
      <button data-tab="inst" onclick="KT.ui.tabblad('inst')">Instellingen</button>
      <label class="slot" title="Nummers vastzetten"><input type="checkbox" id="slot" onchange="KT.ui.zetSlot(this.checked)"> Project op slot</label>
    </nav>
    <div id="inhoud"></div>
    <div id="drie">
      <div id="gl"></div>
      <canvas id="canvas"></canvas>
      <div id="tip"></div>
    </div>
  </main>
</div>
<script src="vendor/three-kabeltool.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/symbol.js"></script>
<script src="js/network.js"></script>
<script src="js/viewer3d.js"></script>
<script src="js/viewer3d-gl.js"></script>
<script src="js/app.js"></script>
<script src="js/vw.js"></script>
</body>
</html>
